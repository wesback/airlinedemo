name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore and build .NET
        run: |
          dotnet restore AirlineDemo.sln
          dotnet build AirlineDemo.sln --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test AirlineDemo.sln --no-build --configuration Release

      - name: Build and test React app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: SBOM (.NET)
        run: |
          mkdir -p artifacts/sbom
          CycloneDX AirlineDemo.sln -j -fn dotnet-sbom.cdx.json -o artifacts/sbom
          test -s artifacts/sbom/dotnet-sbom.cdx.json

      - name: SBOM (npm)
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/sbom
          npx --yes @cyclonedx/cyclonedx-npm@4 --output-format JSON --output-file ../artifacts/sbom/npm-sbom.cdx.json
          test -s ../artifacts/sbom/npm-sbom.cdx.json

      - name: Audit (.NET)
        run: |
          mkdir -p artifacts/audit
          dotnet list AirlineDemo.sln package --vulnerable --include-transitive > artifacts/audit/dotnet-vulnerable.txt
          test -s artifacts/audit/dotnet-vulnerable.txt

      - name: Audit (npm)
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/audit
          npm audit --json > ../artifacts/audit/npm-audit.json || true
          test -s ../artifacts/audit/npm-audit.json

      - name: Source restriction
        run: |
          set -euo pipefail
          bad_nuget=$(dotnet nuget list source | grep -E 'https?://' | grep -v -E '^ *https://api\.nuget\.org/v3/index\.json$' || true)
          if [ -n "$bad_nuget" ]; then
            echo "::error::NuGet source outside nuget.org:"
            echo "$bad_nuget"
            exit 1
          fi
          bad_npm=$(grep -E '"resolved": "https?://' frontend/package-lock.json | grep -v -E '"resolved": "https://registry\.npmjs\.org/' || true)
          if [ -n "$bad_npm" ]; then
            echo "::error::npm package resolved outside npmjs.org"
            exit 1
          fi
          grep -q '"resolved": "https://registry.npmjs.org/' frontend/package-lock.json

      - name: Secret scan
        run: |
          pattern='(AccountKey|SharedAccessSignature|Password|Pwd|Secret|Token|ApiKey)=[^;[:space:]"]{8,}|Server=[^;]*;[^"]*(Password|Pwd)=|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|[A-Za-z][A-Za-z0-9+.-]*://[^/[:space:]:@"]+:[^/[:space:]@"]+@'
          if git grep -l -I -E "$pattern" -- . ':!frontend/package-lock.json'; then
            echo "::error::Committed credential or connection string found in the files listed above"
            exit 1
          fi

      - name: Exception validation
        run: |
          node <<'EOF'
          const fs = require('fs');
          const today = new Date().toISOString().slice(0, 10);
          const file = 'docs/security/dependency-audit-exceptions.json';
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(doc.exceptions)) throw new Error(file + ': exceptions must be an array');
          const isRealDate = (s) => {
            if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const d = new Date(s + 'T00:00:00Z');
            return !isNaN(d) && d.toISOString().slice(0, 10) === s;
          };
          const errors = [];
          doc.exceptions.forEach((e, i) => {
            for (const key of ['package', 'reason', 'expires']) {
              if (typeof e[key] !== 'string' || e[key].trim() === '') errors.push(`exception ${i}: missing ${key}`);
            }
            if (!isRealDate(e.expires)) {
              errors.push(`exception ${e.package}: expires must be a real calendar date in YYYY-MM-DD form`);
            } else if (e.expires < today) {
              errors.push(`exception ${e.package}: expired on ${e.expires}`);
            }
          });
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log(`${doc.exceptions.length} exception(s) valid`);
          EOF

      - name: Severity gate
        run: |
          node <<'EOF'
          const fs = require('fs');
          const today = new Date().toISOString().slice(0, 10);
          const exceptions = JSON.parse(fs.readFileSync('docs/security/dependency-audit-exceptions.json', 'utf8')).exceptions;
          const npm = JSON.parse(fs.readFileSync('artifacts/audit/npm-audit.json', 'utf8'));
          if (npm.error) throw new Error('npm audit failed: ' + (npm.error.summary || npm.error.code));
          if (!npm.metadata) throw new Error('npm audit output has no metadata');
          const findings = [];
          for (const [name, v] of Object.entries(npm.vulnerabilities || {})) {
            if (v.severity === 'high' || v.severity === 'critical') findings.push({ source: 'npm', package: name, severity: v.severity });
          }
          const dotnetLines = fs.readFileSync('artifacts/audit/dotnet-vulnerable.txt', 'utf8').split('\n');
          for (const line of dotnetLines) {
            const m = line.match(/^\s*>\s+(\S+)\s+\S+\s+\S+\s+(High|Critical)\b/i);
            if (m) findings.push({ source: 'dotnet', package: m[1], severity: m[2].toLowerCase() });
          }
          const blocked = findings.filter(f => !exceptions.some(e => e.package === f.package && e.expires >= today));
          if (blocked.length) {
            for (const f of blocked) console.error(`::error::${f.source} ${f.package} has a ${f.severity} finding with no valid exception`);
            process.exit(1);
          }
          console.log(`${findings.length} high/critical finding(s), all covered by valid exceptions`);
          EOF

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: artifacts/
          retention-days: 90
